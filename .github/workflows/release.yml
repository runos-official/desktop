name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the application
        run: make verify

  build:
    needs: verify
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - go_arch: arm64
            xcode_arch: arm64
          - go_arch: amd64
            xcode_arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the application
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          version="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project RunOSDesktop.xcodeproj \
            -scheme RunOSDesktop \
            -configuration Release \
            -derivedDataPath build/DerivedData-${{ matrix.go_arch }} \
            ARCHS=${{ matrix.xcode_arch }} \
            ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION="$version" \
            build
          app="build/DerivedData-${{ matrix.go_arch }}/Build/Products/Release/RunOS Desktop.app"
          codesign --force --deep --sign - --options runtime "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/runos-desktop-macos-${{ matrix.go_arch }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.go_arch }}
          path: dist/runos-desktop-macos-${{ matrix.go_arch }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum runos-desktop-macos-arm64.zip runos-desktop-macos-amd64.zip > checksums.txt
      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/runos-desktop-macos-arm64.zip
            dist/runos-desktop-macos-amd64.zip
      - name: Extract release notes
        run: |
          base="${GITHUB_REF_NAME%%-*}"
          escaped_base="${base//./\\.}"
          awk "
            /^## ${escaped_base}([[:space:]]|$)/ { found=1; next }
            found && /^## / { exit }
            found { print }
          " CHANGELOG.md > release_notes.txt
          test -s release_notes.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --notes-file release_notes.txt \
            --verify-tag \
            "${prerelease[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
